name: Latest Blog Posts

on:
  schedule:
    # 每天 UTC 00:00 自动抓取一次
    - cron: "0 0 * * *"
  workflow_dispatch: # 允许手动触发

jobs:
  update-readme-with-blog:
    name: Sync Latest Blog Posts to Profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch & Inject Blog Posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # ──────────────────────────────────────────
          # 接入指南：
          #   1. 在公众号后台 / 知乎专栏 / 个人博客开启 RSS 输出
          #   2. 将下方 feed_list 的 URL 替换为你的实际 RSS 地址
          #   3. 取消注释 feed_list，Push 后立即生效
          # ──────────────────────────────────────────
          # feed_list: "https://your-blog.com/rss.xml"
          max_post_count: 5
          template: "$newline - $title"
          date_format: "yyyy/mm/dd"
          comment_tag_name: "BLOG-POST-LIST"
          commit_message: "docs(profile): sync latest blog posts [automated]"
          gh_token: ${{ secrets.GITHUB_TOKEN }}
